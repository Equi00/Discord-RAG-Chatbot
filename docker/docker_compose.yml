version: "3.9"

services:
  feedback_db:
    image: mongo:latest
    container_name: feedback_mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - feedback_db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ../backend
    container_name: discord_rag_backend
    environment:
      MONGO_URL: mongodb://feedback_db:27017
    ports:
      - "8000:8000"
    depends_on:
      feedback_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  discord_bot:
    build: ../frontend
    container_name: discord_rag_bot
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  ollama-init:
    image: alpine:latest
    depends_on:
      - ollama
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl &&
      until curl -s http://ollama:11434/api/tags > /dev/null; do
        echo 'Waiting for Ollama...';
        sleep 2;
      done;
      echo 'Pulling model...';
      curl -X POST http://ollama:11434/api/pull -d '{\"name\":\"smollm2:latest\"}';
      "

volumes:
  ollama_data:
  feedback_db: